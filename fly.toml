# Fly.io configuration
# 'app' is set when you run: flyctl launch
# Update it with the name Fly assigns to your app.
app = "hdfc-mf-faq-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

# Fly.io sets $PORT = internal_port automatically.
# start.sh reads $PORT, so uvicorn binds to 8080 on Fly.io.
[http_service]
  internal_port    = 8080
  force_https      = true
  auto_stop_machines  = true   # free tier: spins down on inactivity
  auto_start_machines = true   # wakes on first request
  min_machines_running = 0     # set to 1 for always-on (uses free allowance)

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "512mb"           # 512 MB — safe headroom for FastAPI + ChromaDB
