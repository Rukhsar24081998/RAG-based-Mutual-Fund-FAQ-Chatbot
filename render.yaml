services:
  - type: web
    name: hdfc-mf-faq-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

    envVars:
      - key: GROQ_API_KEY
        sync: false          # Set this manually in the Render dashboard

    # -------------------------------------------------------------------
    # Persistent Disk (Starter plan, $7/month)
    # Uncomment to avoid re-running the ingest pipeline on every cold start.
    # Without this, the 4-step ingest pipeline (~5 min) runs on each deploy.
    # -------------------------------------------------------------------
    # disk:
    #   name: app-data
    #   mountPath: /app/data
    #   sizeGB: 1
